# Keep the Gradle 6.7 zip inside this project so an offline PC does not download it.
# distributionBase=PROJECT means the path below is relative to the project root.
distributionBase=PROJECT
distributionPath=gradle/wrapper/dists
# The zip already sits at gradle/wrapper/dists/gradle-6.7-bin/<hash>/gradle-6.7-bin.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-6.7-bin.zip
zipStoreBase=PROJECT
zipStorePath=gradle/wrapper/dists
