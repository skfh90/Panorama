// Root build file. Resolves the Android Gradle Plugin from the vendored Maven repo.

buildscript {
    repositories {
        // Offline copy of every jar/aar this project resolved. See third_party/m2.
        maven { url uri("${rootDir}/third_party/m2") }
        // Used only when a package is missing and the machine has network.
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin 4.1.3 matches Gradle 6.7 and compileSdk 29.
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        maven { url uri("${rootDir}/third_party/m2") }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// GitHub rejects a single blob over 100 MB. The 224 MB SDK zip is stored as
// 45 MB parts in third_party/opencv-parts/. This task joins them, or uses a
// zip that is already on disk, then unpacks. It downloads only if both are missing.
def opencvVersion = "4.5.5"
def opencvZip = new File(rootDir, "third_party/opencv-${opencvVersion}-android-sdk.zip")
def opencvPartsDir = new File(rootDir, "third_party/opencv-parts")
def opencvRoot = new File(rootDir, "third_party/opencv")
def opencvMarker = new File(opencvRoot, "sdk/native/jni/OpenCVConfig.cmake")

def joinOpenCvParts = {
    if (!opencvPartsDir.isDirectory()) {
        return false
    }
    def parts = opencvPartsDir.listFiles()?.findAll { file ->
        file.isFile() && file.name.startsWith("opencv-${opencvVersion}-android-sdk.zip.part-")
    }?.sort { it.name }
    if (parts == null || parts.isEmpty()) {
        return false
    }
    logger.lifecycle("Joining ${parts.size()} OpenCV SDK parts into ${opencvZip.name}...")
    opencvZip.parentFile.mkdirs()
    opencvZip.withOutputStream { out ->
        parts.each { part ->
            part.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    out.write(buffer, 0, read)
                }
            }
        }
    }
    return opencvZip.isFile() && opencvZip.length() > 50L * 1024L * 1024L
}

task fetchOpenCvSdk {
    outputs.upToDateWhen { opencvMarker.exists() }
    doLast {
        if (opencvMarker.exists()) {
            return
        }
        if (!opencvZip.exists() || opencvZip.length() < 50L * 1024L * 1024L) {
            if (!joinOpenCvParts()) {
                logger.lifecycle("Downloading OpenCV ${opencvVersion} Android SDK (about 230 MB)...")
                opencvZip.parentFile.mkdirs()
                exec {
                    commandLine "curl", "-fL", "--retry", "3", "-o", opencvZip.absolutePath,
                            "https://github.com/opencv/opencv/releases/download/${opencvVersion}/opencv-${opencvVersion}-android-sdk.zip"
                }
            }
        }
        def unpacked = new File(buildDir, "opencv-sdk-unpack")
        delete unpacked
        copy {
            from zipTree(opencvZip)
            into unpacked
        }
        def extracted = new File(unpacked, "OpenCV-android-sdk")
        if (!extracted.isDirectory()) {
            throw new GradleException("OpenCV SDK archive did not contain OpenCV-android-sdk/")
        }
        if (opencvRoot.getParentFile() != null) {
            opencvRoot.getParentFile().mkdirs()
        }
        delete opencvRoot
        if (!extracted.renameTo(opencvRoot)) {
            throw new GradleException("Could not move OpenCV SDK to ${opencvRoot}")
        }
        if (!opencvMarker.exists()) {
            throw new GradleException("OpenCV SDK is missing ${opencvMarker}")
        }
        logger.lifecycle("OpenCV ${opencvVersion} Android SDK ready.")
    }
}
