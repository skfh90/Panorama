# This file is read by Gradle before the build starts.
# JDK 11 is required. Gradle 6.7 cannot start on JDK 17 or newer.
# Android Studio: File > Settings > Build Tools > Gradle > Gradle JDK = 11.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The app uses AndroidX libraries (appcompat, recyclerview).
android.useAndroidX=true
# Do not rewrite third-party bytecode. Every dependency is already AndroidX.
android.enableJetifier=false
# One task at a time. Safer on a small offline Windows machine.
org.gradle.parallel=false
